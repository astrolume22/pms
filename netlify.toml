# Netlify build config for PMS (Vite + TanStack Router SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback: TanStack Router handles routing client-side, so every
# deep link (e.g. /login, /profile, /admin) must be served index.html.
# Keep this AFTER any specific redirects you add later (asset rewrites,
# /api proxies, etc.) — Netlify matches in order.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --------------------------------------------------------------------
# Security headers — sane baseline; tighten in later phases.
# --------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
